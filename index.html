<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOY WINGO - 30 SEC PREDICTOR V2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 82% 25%, rgba(16, 78, 108, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 18% 75%, rgba(118, 28, 92, 0.22) 0%, transparent 45%),
        linear-gradient(90deg, #060b14 0%, #09121e 68%, #071622 100%);
      padding: 12px;
      overflow-x: hidden;
    }

    /* Outer Popup Card matching image_7d2c94bc-86e9-4be4-8c5e-0b9b7135d573.jpg */
    .popup-card {
      position: relative;
      width: 100%;
      max-width: 432px;
      border-radius: 28px;
      padding: 12px;
      background:
        radial-gradient(circle at 50% 16%, rgba(25, 92, 118, 0.65) 0%, rgba(12, 22, 46, 0.96) 52%, rgba(24, 11, 44, 0.98) 100%);
      border: 2.5px solid #e6429c;
      box-shadow:
        0 0 0 2px rgba(56, 214, 255, 0.22),
        0 0 22px rgba(230, 66, 156, 0.55),
        0 0 42px rgba(25, 195, 255, 0.2),
        0 18px 46px rgba(0, 0, 0, 0.92);
      color: #ffffff;
      user-select: none;
    }

    /* Top Header Row */
    .top-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      position: relative;
      z-index: 5;
    }

    .play-smarter-wrap {
      transform: rotate(-8deg);
      margin-top: 2px;
      margin-left: 2px;
    }

    .play-smarter-top {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 13px;
      font-weight: 950;
      font-style: italic;
      line-height: 0.95;
      color: #e8ff38;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
    }

    .play-smarter-top .up-trend {
      color: #42ff7a;
      font-size: 14px;
    }

    .play-smarter-bottom {
      position: relative;
      font-size: 14px;
      font-weight: 950;
      font-style: italic;
      line-height: 1;
      color: #dcff24;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.92);
    }

    .play-smarter-bottom::before {
      content: "";
      position: absolute;
      left: -4px;
      bottom: -1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle, #9cffda 0%, #15bd7e 70%, transparent 100%);
      box-shadow: 0 0 10px #2effb2;
    }

    .hide-btn {
      background: linear-gradient(180deg, #3992f0 0%, #14498c 100%);
      border: 2px solid #82d0ff;
      border-radius: 14px;
      padding: 7px 14px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.6),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    .hide-icon {
      width: 13px;
      height: 13px;
      border: 2.2px solid #ffffff;
      border-radius: 2px;
      display: inline-block;
    }

    /* Brand Header */
    .brand-header {
      position: relative;
      text-align: center;
      margin-top: -22px;
      margin-bottom: 10px;
      z-index: 2;
    }

    .main-crown {
      width: 38px;
      height: 23px;
      margin: 0 auto -4px;
      display: block;
      filter: drop-shadow(0 0 8px rgba(255, 195, 20, 0.9));
    }

    .brand-name-container {
      position: relative;
      display: inline-block;
    }

    .wing-left,
    .wing-right {
      position: absolute;
      top: 54%;
      transform: translateY(-50%);
      width: 84px;
      height: 46px;
      pointer-events: none;
      z-index: 0;
      filter: drop-shadow(0 0 9px rgba(34, 226, 255, 0.85));
    }

    .wing-left {
      left: -68px;
      transform: translateY(-50%) scaleX(-1);
    }

    .wing-right {
      right: -68px;
    }

    .brand-name-text {
      position: relative;
      z-index: 1;
      font-size: 54px;
      font-weight: 950;
      letter-spacing: 2px;
      line-height: 0.92;
      background: linear-gradient(180deg, #fff17a 0%, #ffa812 52%, #e65500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1.4px #591c00;
      filter: drop-shadow(0 3px 0 #471400) drop-shadow(0 6px 12px rgba(255, 145, 0, 0.45));
    }

    .wingo-text {
      position: relative;
      z-index: 2;
      font-size: 32px;
      font-weight: 950;
      font-style: italic;
      letter-spacing: 1.5px;
      line-height: 0.95;
      margin-top: 1px;
      background: linear-gradient(180deg, #8ceaff 0%, #1ea6ff 58%, #0a4ec2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      -webkit-text-stroke: 1px #062154;
      filter: drop-shadow(0 2px 0 #05183d) drop-shadow(0 0 10px rgba(30, 166, 255, 0.55));
    }

    .predictor-badge-wrap {
      position: relative;
      z-index: 3;
      display: inline-block;
      margin-top: 3px;
      padding: 4px 18px;
      border-radius: 12px;
      background: linear-gradient(180deg, #1b2238 0%, #090c17 100%);
      border: 1.5px solid #f0be3c;
      box-shadow: 0 0 12px rgba(240, 190, 60, 0.4);
    }

    .predictor-badge-text {
      font-size: 16px;
      font-weight: 950;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    /* Sculpted 3D Cutout Lottery Balls */
    .cutout-ball {
      position: relative;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 950;
      overflow: hidden;
    }

    /* Top glossy specular highlight */
    .cutout-ball::after {
      content: "";
      position: absolute;
      top: 5%;
      left: 14%;
      width: 72%;
      height: 36%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Sculpted off-white cutout disc with recessed bevel */
    .cutout-ball::before {
      content: "";
      position: absolute;
      width: 64%;
      height: 64%;
      border-radius: 50%;
      background: radial-gradient(circle at 42% 36%, #ffffff 0%, #edf2f7 56%, #c2cedb 100%);
      box-shadow:
        inset 0 2.5px 4px rgba(0, 0, 0, 0.38),
        inset 0 -2px 3px rgba(255, 255, 255, 0.92),
        0 0 0 1.5px rgba(255, 255, 255, 0.5);
      z-index: 1;
    }

    .cutout-ball span {
      position: relative;
      z-index: 2;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .ball-red {
      background: radial-gradient(circle at 30% 25%, #ff8585 0%, #df1d1d 58%, #6e0606 100%);
      box-shadow:
        inset -3px -4px 8px rgba(0, 0, 0, 0.55),
        0 0 18px rgba(255, 55, 55, 0.6),
        0 5px 10px rgba(0, 0, 0, 0.65);
    }
    .ball-red span { color: #b81d1d; }

    .ball-green {
      background: radial-gradient(circle at 30% 25%, #84ffb8 0%, #14b558 58%, #055225 100%);
      box-shadow:
        inset -3px -4px 8px rgba(0, 0, 0, 0.55),
        0 0 18px rgba(34, 224, 118, 0.6),
        0 5px 10px rgba(0, 0, 0, 0.65);
    }
    .ball-green span { color: #117a3d; }

    .ball-purple {
      background: radial-gradient(circle at 30% 25%, #dc94ff 0%, #8726de 58%, #3a086e 100%);
      box-shadow:
        inset -3px -4px 8px rgba(0, 0, 0, 0.55),
        0 0 14px rgba(176, 74, 255, 0.45),
        0 5px 10px rgba(0, 0, 0, 0.65);
    }
    .ball-purple span { color: #5b189c; }

    /* Top Floating Balls */
    .top-ball { position: absolute; z-index: 3; }
    .t-ball-4 { width: 56px; height: 56px; top: 52px; left: -6px; font-size: 24px; }
    .t-ball-3 { width: 36px; height: 36px; top: 94px; left: 44px; font-size: 16px; }
    .t-ball-9 { width: 56px; height: 56px; top: 52px; right: -6px; font-size: 24px; }
    .t-ball-8 { width: 34px; height: 34px; top: 96px; right: 48px; font-size: 15px; }

    /* 3 Chamfered Columns */
    .columns-row {
      display: grid;
      grid-template-columns: 1fr 1.18fr 1fr;
      gap: 7px;
      align-items: stretch;
      margin-bottom: 9px;
    }

    .chamfer-border {
      clip-path: polygon(18px 0%, calc(100% - 18px) 0%, 100% 18px, 100% 100%, 0% 100%, 0% 18px);
      border-radius: 14px;
      padding: 2px;
      display: flex;
    }

    .border-small { background: linear-gradient(180deg, #5ce8ff 0%, #1c85b8 100%); }
    .border-center { background: linear-gradient(180deg, #32dcff 0%, #146a9c 100%); }
    .border-big { background: linear-gradient(180deg, #ff5eb0 0%, #8c1952 100%); }

    .chamfer-inner {
      width: 100%;
      clip-path: polygon(17px 0%, calc(100% - 17px) 0%, 100% 17px, 100% 100%, 0% 100%, 0% 17px);
      border-radius: 12px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .small-inner { background: linear-gradient(180deg, #1b9ad4 0%, #0a4875 60%, #062540 100%); }
    .center-inner { background: linear-gradient(180deg, #111a36 0%, #080c1c 100%); }
    .big-inner { background: linear-gradient(180deg, #9e1a5c 0%, #570c33 60%, #260416 100%); }

    .mini-crown-svg {
      width: 22px;
      height: 13px;
      margin: 0 auto 2px;
      display: block;
    }

    .small-inner h2,
    .big-inner h2 {
      font-size: 22px;
      font-weight: 950;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.55);
    }

    .small-inner .num-range { font-size: 17px; font-weight: 800; color: #dff8ff; margin-top: 2px; }
    .big-inner .num-range { font-size: 17px; font-weight: 800; color: #ffd4ea; margin-top: 2px; }

    .status-predicted {
      width: 100%;
      background: rgba(5, 25, 46, 0.85);
      border: 1.5px solid #4de6ff;
      border-radius: 10px;
      padding: 6px 5px;
      font-size: 11px;
      font-weight: 950;
      color: #6df0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .status-predicted .tick {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #1a8cff;
      color: #ffffff;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-not-predicted {
      width: 100%;
      background: rgba(36, 7, 22, 0.82);
      border: 1.5px solid rgba(255, 130, 190, 0.45);
      border-radius: 10px;
      padding: 6px 4px;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.1;
      color: rgba(255, 190, 220, 0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .status-not-predicted .cross {
      width: 15px;
      height: 15px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.16);
      color: #ff9ec9;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .round-meta { width: 100%; text-align: left; }
    .round-meta .no-lbl { font-size: 11px; font-weight: 800; color: #b7c9f2; }
    .round-meta .no-val { font-size: 11px; font-weight: 950; color: #ffffff; letter-spacing: -0.2px; white-space: nowrap; }

    /* Center Glowing Orb & HUD Rings */
    .orb-stage {
      position: relative;
      width: 108px;
      height: 108px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }

    .orb-dashed {
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 2.5px dashed rgba(52, 255, 180, 0.8);
      box-shadow: 0 0 18px rgba(25, 240, 150, 0.5), inset 0 0 14px rgba(25, 240, 150, 0.3);
    }

    .orb-glow-arc {
      position: absolute;
      inset: 8px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: #38ffb8;
      border-right-color: #38ffb8;
      filter: drop-shadow(0 0 8px #38ffb8);
    }

    .center-orb-ball {
      width: 70px;
      height: 70px;
      font-size: 28px;
    }

    .timer-box {
      width: 100%;
      background: linear-gradient(180deg, #1b1829 0%, #0d0c16 100%);
      border: 1.5px solid #e6b843;
      border-radius: 10px;
      padding: 4px 6px;
      box-shadow: 0 0 10px rgba(230, 184, 67, 0.25);
    }

    .timer-title { font-size: 10px; font-weight: 950; color: #ffd35c; letter-spacing: 0.6px; }
    .timer-val { font-size: 18px; font-weight: 950; color: #ffcf48; display: flex; align-items: center; justify-content: center; gap: 4px; line-height: 1.1; }

    /* Recent Results */
    .recent-panel {
      background: linear-gradient(180deg, #0f203d 0%, #081122 100%);
      border: 1.5px solid #2b88c9;
      border-radius: 16px;
      padding: 8px 8px 9px;
    }

    .recent-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 950;
      letter-spacing: 0.6px;
      color: #d8eeff;
      margin-bottom: 7px;
    }

    .recent-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 3px;
      align-items: center;
      justify-items: center;
    }

    .r-ball {
      width: 32px;
      height: 32px;
      font-size: 13px;
    }

    @media (max-width: 400px) {
      .brand-name-text { font-size: 46px; }
      .wingo-text { font-size: 27px; }
      .round-meta .no-val { font-size: 9.6px; }
      .r-ball { width: 27px; height: 27px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <div class="popup-card" id="wingoPopup">
    <!-- Top 3D Cutout Balls -->
    <div class="cutout-ball ball-red top-ball t-ball-4"><span>4</span></div>
    <div class="cutout-ball ball-green top-ball t-ball-3"><span>3</span></div>
    <div class="cutout-ball ball-green top-ball t-ball-9"><span>9</span></div>
    <div class="cutout-ball ball-red top-ball t-ball-8"><span>8</span></div>

    <!-- Top Header -->
    <div class="top-bar">
      <div class="play-smarter-wrap">
        <div class="play-smarter-top">PLAY <span class="up-trend">↗</span></div>
        <div class="play-smarter-bottom">SMARTER</div>
      </div>

      <button class="hide-btn" onclick="document.getElementById('wingoPopup').style.opacity = document.getElementById('wingoPopup').style.opacity === '0.25' ? '1' : '0.25'">
        <span class="hide-icon"></span>
        HIDE
      </button>
    </div>

    <!-- Brand & Wings -->
    <div class="brand-header">
      <svg class="main-crown" viewBox="0 0 64 38">
        <path d="M4 32 L10 10 L23 22 L32 5 L41 22 L54 10 L60 32 Z" fill="url(#goldGrad)" stroke="#6b2b00" stroke-width="2.5" stroke-linejoin="round"/>
        <rect x="6" y="32" width="52" height="5" rx="2" fill="#ffb703" stroke="#6b2b00" stroke-width="1.5"/>
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff078"/>
            <stop offset="60%" stop-color="#ffaa00"/>
            <stop offset="100%" stop-color="#e05a00"/>
          </linearGradient>
        </defs>
      </svg>

      <div class="brand-name-container">
        <svg class="wing-right" viewBox="0 0 100 60">
          <path d="M5 14 Q52 10 92 18 Q58 24 8 22 Z" fill="#29dcff"/>
          <path d="M6 25 Q56 23 96 32 Q58 36 8 33 Z" fill="#1cb8f5"/>
          <path d="M8 36 Q52 37 84 46 Q48 47 10 43 Z" fill="#46ebff"/>
        </svg>
        <svg class="wing-left" viewBox="0 0 100 60">
          <path d="M5 14 Q52 10 92 18 Q58 24 8 22 Z" fill="#29dcff"/>
          <path d="M6 25 Q56 23 96 32 Q58 36 8 33 Z" fill="#1cb8f5"/>
          <path d="M8 36 Q52 37 84 46 Q48 47 10 43 Z" fill="#46ebff"/>
        </svg>
        <div class="brand-name-text">JOY</div>
      </div>

      <div class="wingo-text">WINGO</div>

      <div class="predictor-badge-wrap">
        <div class="predictor-badge-text">30 SEC PREDICTOR V2</div>
      </div>
    </div>

    <!-- 3 Chamfered Columns -->
    <div class="columns-row">
      <div class="chamfer-border border-small">
        <div class="chamfer-inner small-inner">
          <div>
            <svg class="mini-crown-svg" viewBox="0 0 40 24">
              <path d="M3 20 L7 6 L15 14 L20 3 L25 14 L33 6 L37 20 Z" fill="#7ceeff" stroke="#083d5e" stroke-width="1.5"/>
            </svg>
            <h2>SMALL</h2>
            <div class="num-range">0 - 4</div>
          </div>
          <div class="status-predicted">
            <span class="tick">✓</span>
            <span>PREDICTED</span>
          </div>
        </div>
      </div>

      <div class="chamfer-border border-center">
        <div class="chamfer-inner center-inner">
          <div class="round-meta">
            <div class="no-lbl">NO:</div>
            <div class="no-val">20261102100052214</div>
          </div>

          <div class="orb-stage">
            <div class="orb-dashed"></div>
            <div class="orb-glow-arc"></div>
            <div class="cutout-ball ball-green center-orb-ball"><span>1</span></div>
          </div>

          <div class="timer-box">
            <div class="timer-title">NEXT IN</div>
            <div class="timer-val">
              <span style="font-size: 13px;">🕒</span>
              <span>23s</span>
            </div>
          </div>
        </div>
      </div>

      <div class="chamfer-border border-big">
        <div class="chamfer-inner big-inner">
          <div>
            <svg class="mini-crown-svg" viewBox="0 0 40 24">
              <path d="M3 20 L7 6 L15 14 L20 3 L25 14 L33 6 L37 20 Z" fill="#ff75ba" stroke="#470527" stroke-width="1.5"/>
            </svg>
            <h2>BIG</h2>
            <div class="num-range">5 - 9</div>
          </div>
          <div class="status-not-predicted">
            <span class="cross">✕</span>
            <span>NOT<br>PREDICTED</span>
          </div>
        </div>
      </div>
    </div>

    <!-- RECENT RESULTS -->
    <div class="recent-panel">
      <div class="recent-title">
        <span style="color: #4be3ff;">📈</span>
        <span>RECENT RESULTS</span>
      </div>
      <div class="recent-grid">
        <div class="cutout-ball ball-purple r-ball"><span>5</span></div>
        <div class="cutout-ball ball-red r-ball"><span>8</span></div>
        <div class="cutout-ball ball-red r-ball"><span>4</span></div>
        <div class="cutout-ball ball-green r-ball"><span>3</span></div>
        <div class="cutout-ball ball-red r-ball"><span>2</span></div>
        <div class="cutout-ball ball-green r-ball"><span>9</span></div>
        <div class="cutout-ball ball-red r-ball"><span>6</span></div>
        <div class="cutout-ball ball-purple r-ball"><span>0</span></div>
        <div class="cutout-ball ball-red r-ball"><span>8</span></div>
        <div class="cutout-ball ball-green r-ball"><span>7</span></div>
      </div>
    </div>
  </div>

</body>
</html>
