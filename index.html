<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>JOY WINGO - 30 SEC PREDICTOR V2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #060a12;
            color: #ffffff;
        }

        #game-iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* ফ্লোটিং আইকন */
        #floating-icon-btn {
            position: fixed;
            top: 84px;
            right: 46px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #ffbe3b;
            box-shadow:
                0 0 0 2px #e03a96,
                0 6px 16px rgba(0, 0, 0, 0.9),
                0 0 14px rgba(224, 58, 150, 0.5);
            cursor: grab;
            z-index: 9999;
            overflow: hidden;
            touch-action: none;
            background: #0d152b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #floating-icon-btn:active {
            cursor: grabbing;
        }

        #floating-icon-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        /* পাসওয়ার্ড পপআপ */
        #auth-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 212px;
            background: radial-gradient(circle at 50% 15%, #19384a 0%, #0d152b 50%, #1d0c2e 100%);
            border: 2px solid #e03a96;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(224, 58, 150, 0.45), 0 16px 36px rgba(0, 0, 0, 0.95);
            padding: 11px;
            display: none;
            z-index: 10000;
            text-align: center;
        }

        .auth-title {
            font-size: 10.5px;
            font-weight: 900;
            color: #fff078;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
            margin-bottom: 7px;
            letter-spacing: 0.4px;
        }

        .auth-input {
            width: 100%;
            padding: 6px 8px;
            background: rgba(9, 12, 23, 0.95);
            border: 1.5px solid #2b88c9;
            border-radius: 9px;
            color: #ffffff;
            font-size: 10.5px;
            text-align: center;
            margin-bottom: 7px;
            outline: none;
            font-weight: 700;
            user-select: text;
            -webkit-user-select: text;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 8.5px;
            color: #d8eeff;
            margin-bottom: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .auth-btn {
            width: 100%;
            padding: 6px;
            background: linear-gradient(180deg, #ffe866 0%, #ffa812 55%, #e65500 100%);
            border: 1.5px solid #f0be3c;
            border-radius: 9px;
            color: #161006;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        #error-msg {
            color: #ff7b7b;
            font-size: 8.5px;
            margin-top: 5px;
            display: none;
            font-weight: 700;
        }

        /* কম্প্যাক্ট JOY WINGO প্যানেল */
        .overlay-box {
            position: fixed;
            top: 76px;
            left: 34px;
            width: 218px;
            max-width: calc(100vw - 40px);
            display: none;
            z-index: 9999;
            border-radius: 22px;
            padding: 8px 8px 7px;
            background: radial-gradient(circle at 50% 16%, #183a4d 0%, #0d152b 48%, #1d0c2e 100%);
            border: 2px solid #e03a96;
            box-shadow:
                0 0 18px rgba(224, 58, 150, 0.45),
                0 0 28px rgba(25, 195, 255, 0.18),
                0 14px 34px rgba(0, 0, 0, 0.92);
            color: #ffffff;
        }

        .wingo-header {
            position: relative;
            cursor: grab;
            touch-action: none;
            padding-bottom: 2px;
            margin-bottom: 4px;
        }

        .wingo-header:active {
            cursor: grabbing;
        }

        .wingo-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 3px;
            margin-bottom: 1px;
        }

        .play-smarter-badge {
            display: inline-flex;
            align-items: center;
            font-size: 5.8px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 0.3px;
            color: #a7f33a;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
            transform: rotate(-3deg);
            pointer-events: none;
            line-height: 1;
        }

        .header-right-actions {
            display: flex;
            align-items: center;
            gap: 2.5px;
        }

        .voice-toggle-btn {
            font-size: 5.5px;
            font-weight: 900;
            padding: 2px 4px;
            border-radius: 6px;
            border: 1px solid #ff8282;
            background: linear-gradient(180deg, #ff5c5c 0%, #b81414 100%);
            color: #ffffff;
            cursor: pointer;
            line-height: 1;
        }

        .voice-toggle-btn.is-off {
            background: linear-gradient(180deg, #1b2238 0%, #090c17 100%);
            color: #94a3b8;
            border-color: rgba(148, 163, 184, 0.45);
        }

        .hide-btn {
            background: linear-gradient(180deg, #338be8 0%, #13488a 100%);
            color: #ffffff;
            border: 1.2px solid #78cbff;
            padding: 2px 5px;
            border-radius: 6px;
            font-size: 5.8px;
            font-weight: 900;
            letter-spacing: 0.4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            line-height: 1;
        }

        .wingo-hero-title-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1px 1px 0;
            pointer-events: none;
        }

        .deco-balls-left,
        .deco-balls-right {
            display: flex;
            flex-direction: column;
            gap: 1.5px;
            z-index: 2;
        }

        .deco-balls-right {
            align-items: flex-end;
        }

        /* 67036_3.jpg এর মতো মাঝখানে সাদা গোলক এবং রঙিন কিনারের ৪ দিকে হালকা সাদা অংশ */
        .deco-ball,
        .color-wheel,
        .glow-orb {
            position: relative;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 950;
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* রঙিন কিনারের ৪ দিকে (উপর, নিচ, বাম, ডান) হালকা সাদা অংশ */
        .deco-ball::before,
        .color-wheel::before,
        .glow-orb::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 4%, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.35) 14%, transparent 25%),
                radial-gradient(circle at 50% 96%, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.35) 14%, transparent 25%),
                radial-gradient(circle at 4% 50%, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.35) 14%, transparent 25%),
                radial-gradient(circle at 96% 50%, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.35) 14%, transparent 25%);
            pointer-events: none;
            z-index: 2;
        }

        /* মাঝখানের সাদা অংশ */
        .deco-ball::after,
        .color-wheel::after,
        .glow-orb::after {
            content: "";
            position: absolute;
            width: 72%;
            height: 72%;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 45%, #ffffff 72%, rgba(255, 255, 255, 0.92) 90%, rgba(255, 255, 255, 0.45) 100%);
            box-shadow: 0 0 2px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 3;
        }

        .deco-ball span,
        .color-wheel span,
        .glow-orb span {
            position: relative;
            z-index: 4;
        }

        .deco-ball-lg {
            width: 20px;
            height: 20px;
            font-size: 9px;
        }

        .deco-ball-sm {
            width: 14px;
            height: 14px;
            font-size: 6.5px;
            margin-left: 8px;
        }

        .deco-balls-right .deco-ball-sm {
            margin-left: 0;
            margin-right: 8px;
        }

        .wingo-center-brand {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .wingo-crown-svg {
            width: 15px;
            height: 9px;
            margin-bottom: -2px;
            filter: drop-shadow(0 0 4px rgba(255, 210, 50, 0.85));
        }

        .wingo-main-title {
            font-size: 13.5px;
            font-weight: 950;
            letter-spacing: 0.35px;
            line-height: 1.04;
            background: linear-gradient(180deg, #fff078 0%, #ffa812 52%, #e65500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.95));
            white-space: nowrap;
        }

        .wingo-sub-title {
            font-size: 9px;
            font-weight: 950;
            font-style: italic;
            letter-spacing: 0.8px;
            line-height: 1.05;
            margin-top: 1px;
            background: linear-gradient(180deg, #8eeeff 0%, #24b8ff 65%, #1273d6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .wingo-subtitle-pill {
            margin: 3px auto 4px;
            padding: 2px 8px;
            border-radius: 999px;
            background: linear-gradient(180deg, #1b2238 0%, #090c17 100%);
            border: 1.2px solid #f0be3c;
            font-size: 6.2px;
            font-weight: 900;
            letter-spacing: 0.5px;
            color: #fff078;
            text-transform: uppercase;
            text-align: center;
            width: fit-content;
        }

        /* মার্কেট ট্যাব */
        .market-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5px;
            margin-bottom: 4px;
            background: linear-gradient(180deg, #1b2238 0%, #090c17 100%);
            padding: 2px;
            border-radius: 8px;
            border: 1px solid rgba(240, 190, 60, 0.55);
        }

        .market-btn {
            font-size: 6.2px;
            font-weight: 900;
            padding: 2px 1px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: rgba(12, 21, 43, 0.9);
            color: #d8eeff;
            cursor: pointer;
            text-align: center;
        }

        .market-btn.active {
            background: linear-gradient(180deg, #ffe866 0%, #ffa812 55%, #e65500 100%);
            color: #161006;
            border-color: #fff078;
        }

        /* কল ব্যানার */
        .ai-call-banner {
            margin-bottom: 5px;
            padding: 2.5px 5px;
            border-radius: 8px;
            background: linear-gradient(180deg, #1b2238 0%, #090c17 100%);
            border: 1.2px solid rgba(41, 216, 255, 0.5);
            font-size: 6.4px;
            font-weight: 800;
            color: #fff078;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* কাটা কোণা ৩ কলাম গ্রিড */
        .wingo-grid {
            display: grid;
            grid-template-columns: 0.92fr 1.26fr 0.92fr;
            gap: 4px;
            align-items: stretch;
        }

        .wingo-side-card {
            clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 10px, 100% 100%, 0% 100%, 0% 10px);
            border-radius: 12px;
            padding: 6px 3px 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.14), 0 4px 10px rgba(0, 0, 0, 0.7);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .wingo-small-card {
            background: linear-gradient(180deg, #1b9ad4 0%, #0a4875 60%, #062540 100%);
            border: 1.8px solid #4be3ff;
        }

        .wingo-big-card {
            background: linear-gradient(180deg, #9e1a5c 0%, #570c33 60%, #260416 100%);
            border: 1.8px solid #ff4da6;
        }

        .wingo-side-card.is-predicted {
            border-color: #ffe866;
            transform: scale(1.02);
            box-shadow: 0 0 12px rgba(255, 232, 102, 0.6), 0 6px 12px rgba(0, 0, 0, 0.85);
        }

        .wingo-card-crown {
            width: 12px;
            height: 7.5px;
            margin-bottom: 1px;
        }

        .wingo-card-title {
            font-size: 9.5px;
            font-weight: 950;
            letter-spacing: 0.3px;
            line-height: 1.05;
            color: #ffffff;
            text-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.7);
        }

        .wingo-card-range {
            font-size: 6.6px;
            font-weight: 800;
            color: #dff8ff;
            margin-top: 1.5px;
        }

        .wingo-big-card .wingo-card-range {
            color: #ffd4ea;
        }

        .wingo-status-pill {
            margin-top: 4px;
            width: 96%;
            padding: 2.5px 1.5px;
            border-radius: 6px;
            font-size: 5.2px;
            font-weight: 950;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .wingo-pill-small-active {
            background: rgba(5, 25, 46, 0.9);
            border: 1px solid #4de6ff;
            color: #6df0ff;
        }

        .wingo-pill-big-active {
            background: rgba(36, 7, 22, 0.9);
            border: 1px solid #ff75ba;
            color: #ff9ec9;
        }

        .wingo-pill-inactive {
            background: rgba(15, 20, 34, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.68);
        }

        .wingo-center-card {
            clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 10px, 100% 100%, 0% 100%, 0% 10px);
            background: linear-gradient(180deg, #111a36 0%, #080c1c 100%);
            border: 1.8px solid #29d8ff;
            border-radius: 12px;
            padding: 5px 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }

        .wingo-period-label {
            font-size: 5.2px;
            font-weight: 800;
            color: #8ceaff;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            line-height: 1.05;
        }

        .wingo-period-num {
            font-size: 5.8px;
            font-weight: 900;
            color: #ffffff;
            margin-top: 1px;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
            white-space: nowrap;
        }

        /* স্থির বৃত্ত (কোনো ঘোরার অ্যানিমেশন নেই) */
        .wingo-orb-stage {
            position: relative;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
        }

        .hud-ticks-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                repeating-conic-gradient(
                    from 0deg,
                    rgba(255, 255, 255, 0.92) 0deg 2deg,
                    transparent 2deg 12deg
                );
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.2px), #000 calc(100% - 1px), transparent calc(100% - 0.4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3.2px), #000 calc(100% - 1px), transparent calc(100% - 0.4px));
            pointer-events: none;
        }

        .hud-outer-arc {
            position: absolute;
            inset: 2.5px;
            border-radius: 50%;
            border: 1.2px dashed rgba(52, 255, 180, 0.78);
            pointer-events: none;
        }

        .glow-orb {
            width: 32px;
            height: 32px;
            font-size: 13px;
        }

        /* বলের রঙ ও নাম্বারের রঙ */
        .orb-green, .w-green {
            background: radial-gradient(circle at 30% 25%, #65e89a 0%, #16b95a 60%, #086930 100%);
            color: #129448;
            box-shadow: 0 0 10px rgba(34, 224, 118, 0.45), 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .orb-red, .w-red {
            background: radial-gradient(circle at 30% 25%, #ff7a7a 0%, #e52424 60%, #8c0c0c 100%);
            color: #d62424;
            box-shadow: 0 0 10px rgba(255, 55, 55, 0.45), 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .orb-violet, .w-violet-green, .w-violet-red {
            background: radial-gradient(circle at 30% 25%, #d98cff 0%, #9b35e8 60%, #4d1087 100%);
            color: #8726de;
            box-shadow: 0 0 10px rgba(176, 74, 255, 0.45), 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .wingo-timer-box {
            width: 96%;
            padding: 2px 3px;
            border-radius: 7px;
            background: linear-gradient(180deg, #1b1829 0%, #0d0c16 100%);
            border: 1.2px solid #e6b843;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wingo-next-in {
            font-size: 5px;
            font-weight: 900;
            color: #ffd866;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            line-height: 1;
        }

        .wingo-sec-val {
            font-size: 7.5px;
            font-weight: 950;
            color: #fff2a6;
            line-height: 1.1;
            margin-top: 1px;
        }

        /* WIN / LOSS বার */
        .winloss-bar {
            margin-top: 5px;
            display: grid;
            grid-template-columns: 0.9fr 1.2fr 0.9fr;
            gap: 3px;
            align-items: center;
        }

        .wl-btn {
            font-size: 5.8px;
            font-weight: 900;
            padding: 2.5px 1px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-win {
            background: linear-gradient(180deg, #4ade80 0%, #14b558 100%);
            color: #042b14;
        }

        .btn-loss {
            background: linear-gradient(180deg, #ff7b7b 0%, #df1d1d 100%);
            color: #ffffff;
        }

        .wl-status {
            font-size: 5.6px;
            font-weight: 900;
            text-align: center;
            padding: 2px 2px;
            border-radius: 6px;
            background: linear-gradient(180deg, #1b2238 0%, #090c17 100%);
            border: 1px solid #f0be3c;
            color: #fff078;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* RECENT RESULTS বক্স */
        .wingo-recent-box {
            margin-top: 5px;
            background: linear-gradient(180deg, #0f203d 0%, #081122 100%);
            border: 1.5px solid #2b88c9;
            border-radius: 12px;
            padding: 5px 5px 6px;
        }

        .wingo-recent-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            padding: 0 1px;
        }

        .wingo-recent-title {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 6px;
            font-weight: 900;
            letter-spacing: 0.4px;
            color: #d8eeff;
            text-transform: uppercase;
        }

        .wingo-recent-icon {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: linear-gradient(135deg, #ff62a5, #b02874);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 5.5px;
            color: #ffffff;
        }

        .wingo-conf-text {
            font-size: 5.8px;
            font-weight: 900;
            color: #38ffb8;
        }

        .wingo-balls-track {
            background: #060a14;
            border: 1px solid rgba(110, 195, 255, 0.25);
            border-radius: 999px;
            padding: 3px 3.5px;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 1.5px;
            align-items: center;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.9);
        }

        .color-wheel {
            width: 15.5px;
            height: 15.5px;
            font-size: 6.5px;
        }

        .bottom-action-bar {
            margin-top: 5px;
            width: 100%;
        }

        .telegram-join-btn {
            width: 100%;
            background: linear-gradient(180deg, #ffe866 0%, #ffa812 55%, #e65500 100%);
            color: #1c1917;
            border: 1.2px solid #f0be3c;
            border-radius: 8px;
            padding: 4px 6px;
            font-size: 6.4px;
            font-weight: 900;
            text-decoration: none;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3.5px;
            text-transform: uppercase;
        }

        #copy-toast {
            position: fixed;
            bottom: 12px;
            left: 50%;

        function getSyncedMarketClock(marketKey, cfg, now) {
            const secInDay = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds();

            const rem = secInDay % cfg.duration;
            const timeLeft = cfg.duration - rem;
            const elapsed = rem;
            const periodIndexToday = slot + 1;
            return { elapsed, timeLeft, periodIndexToday };

        function mixHash(seed) {
            let x = seed >>> 0;
            x ^= x >>> 16;
            x = Math.imul(x, 0x7feb352d) >>> 0;
            x ^= x >>> 15;
            x = Math.imul(x, 0x846ca68b) >>> 0;
            x ^= x >>> 16;
            return x >>> 0;

        function getColorMeta(num) {
            if (num === 0) {

            if (num === 5) {
                return { orbClass: "orb-violet", wheelClass: "w-violet-green", colorName: "VIOLET+GRN" };
            }
            if ([1, 3, 7, 9].includes(num)) {
                return { orbClass: "orb-green", wheelClass: "w-green", colorName: "GREEN" };
            }
            return { orbClass: "orb-red", wheelClass: "w-red", colorName: "RED" };
        }

        function evaluateSlot(slotNum, cfg, dateSeed) {
            const baseSeed = (dateSeed ^ Math.imul(slotNum, cfg.salt)) >>> 0;
            const h1 = mixHash(baseSeed);
            const h2 = mixHash(h1 ^ (slotNum * 2654435761));

            let prevStreakType = null;
            let streakCount = 0;
            let bigCount = 0;

            for (let lookback = 1; lookback <= 5; lookback++) {
                const prevIdx = Math.max(1, slotNum - lookback);
                const pHash = mixHash((dateSeed ^ Math.imul(prevIdx, cfg.salt)) >>> 0);
                const pIsBig = (pHash % 100) >= 49;
                if (pIsBig) bigCount++;

                if (lookback === 1) {
                    prevStreakType = pIsBig ? "BIG" : "SMALL";
                    streakCount = 1;
                } else if (((pIsBig ? "BIG" : "SMALL") === prevStreakType) && streakCount === lookback - 1) {
                    streakCount++;
                }
            }

            let bigScore = h1 % 100;

            if (prevStreakType === "BIG" && streakCount >= 3) {
                bigScore -= 18;
            } else if (prevStreakType === "SMALL" && streakCount >= 3) {
                bigScore += 18;
            }

            if (bigCount >= 4) bigScore -= 10;
            if (bigCount <= 1) bigScore += 10;

            const type = bigScore >= 50 ? "BIG" : "SMALL";

            const poolSmall = [0, 1, 2, 3, 4];
            const poolBig = [5, 6, 7, 8, 9];
            const pool = type === "BIG" ? poolBig : poolSmall;

            let pickIdx = h2 % pool.length;
            let num = pool[pickIdx];

            if (slotNum > 1) {
                const prevNum = evaluateSlotRawNum(slotNum - 1, cfg, dateSeed);
                if (num === prevNum) {
                    num = pool[(pickIdx + 1) % pool.length];
                }
            }

            const delta = Math.abs(bigScore - 50);
            const confidence = Math.min(94, Math.max(76, 78 + Math.floor(delta * 0.65) + (h2 % 6)));
            const meta = getColorMeta(num);

            return { type, num, confidence, ...meta };
        }

        function evaluateSlotRawNum(slotNum, cfg, dateSeed) {
            const baseSeed = (dateSeed ^ Math.imul(slotNum, cfg.salt)) >>> 0;
            const h1 = mixHash(baseSeed);
            const h2 = mixHash(h1 ^ (slotNum * 2654435761));
            const type = (h1 % 100) >= 50 ? "BIG" : "SMALL";
            const pool = type === "BIG" ? [5, 6, 7, 8, 9] : [0, 1, 2, 3, 4];
            return pool[h2 % pool.length];
        }

                smallTag.innerText = "WAIT";
                bigTag.innerText = "WAIT";
                smallTag.className = "wingo-status-pill wingo-pill-inactive";
                bigTag.className = "wingo-status-pill wingo-pill-inactive";
            } else {
                orbText.innerText = String(cachedPrediction.num);
                orb.className = `glow-orb ${cachedPrediction.orbClass}`;
                document.getElementById('color-label').innerText = `RECENT RESULTS · ${cachedPrediction.colorName}`;
                confLabel.innerText = `CONF ${cachedPrediction.confidence}%`;
                document.getElementById("ai-call-banner").textContent = `👩 ${getTradeCallSentence(cachedPrediction)}`;

                if (cachedPrediction.type === "BIG") {
                    bigPanel.classList.add('is-predicted');
                    smallPanel.classList.remove('is-predicted');
                    bigTag.innerText = "✓ PREDICTED";
                    bigTag.className = "wingo-status-pill wingo-pill-big-active";
                    smallTag.innerText = "✕ NOT PREDICTED";
                    smallTag.className = "wingo-status-pill wingo-pill-inactive";
                } else {
                    smallPanel.classList.add('is-predicted');
                    bigPanel.classList.remove('is-predicted');
                    smallTag.innerText = "✓ PREDICTED";
                    smallTag.className = "wingo-status-pill wingo-pill-small-active";
                    bigTag.innerText = "✕ NOT PREDICTED";
                    bigTag.className = "wingo-status-pill wingo-pill-inactive";
                }
            }

            if (periodJustChanged && lastEvaluatedPeriod !== fullPeriod) {
                lastEvaluatedPeriod = fullPeriod;
                announcePeriodUpdateBangla(cachedPrediction, outcomeSentence);
            }

            renderRecentWheels(cfg, periodIndexToday, dateSeed);
        }

        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                pickFemaleBanglaVoice();
            };
        }

        makeDraggable(document.getElementById("floating-icon-btn"), document.getElementById("floating-icon-btn"), handleIconClick);
        makeDraggable(document.getElementById("main-content"), document.getElementById("main-content-header"), null);

        function makeDraggable(targetEl, handleEl, onTap) {
            let isDown = false;
            let moved = false;
            let startX = 0, startY = 0, origLeft = 0, origTop = 0;

            function onStart(x, y) {
                const rect = targetEl.getBoundingClientRect();
                origLeft = rect.left;
                origTop = rect.top;
                startX = x;
                startY = y;
                isDown = true;
                moved = false;
                targetEl.style.left = `${origLeft}px`;
                targetEl.style.top = `${origTop}px`;
                targetEl.style.right = "auto";
                targetEl.style.bottom = "auto";
                targetEl.style.transform = "none";
            }

            function onMove(x, y) {
                if (!isDown) return;
                const dx = x - startX;
                const dy = y - startY;
                if (Math.hypot(dx, dy) > 6) moved = true;
                const maxLeft = Math.max(4, window.innerWidth - targetEl.offsetWidth - 4);
                const maxTop = Math.max(4, window.innerHeight - targetEl.offsetHeight - 4);
                targetEl.style.left = `${Math.max(4, Math.min(maxLeft, origLeft + dx))}px`;
                targetEl.style.top = `${Math.max(4, Math.min(maxTop, origTop + dy))}px`;
            }

            function onEnd() {
                if (!isDown) return;
                isDown = false;
                if (!moved && typeof onTap === "function") onTap();
            }

            handleEl.addEventListener("touchstart", (e) => {
                if (e.target.closest("button") || e.target.closest("a") || e.target.closest("input")) return;
                if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: true });

            handleEl.addEventListener("touchmove", (e) => {
                if (!isDown || e.touches.length !== 1) return;
                e.preventDefault();
                onMove(e.touches[0].clientX, e.touches[0].clientY);
            }, { passive: false });

            handleEl.addEventListener("touchend", onEnd);
            handleEl.addEventListener("touchcancel", onEnd);

            handleEl.addEventListener("mousedown", (e) => {
                if (e.button !== 0 || e.target.closest("button") || e.target.closest("a") || e.target.closest("input")) return;
                onStart(e.clientX, e.clientY);

                function mm(ev) { onMove(ev.clientX, ev.clientY); }
                function mu() {
                    document.removeEventListener("mousemove", mm);
                    document.removeEventListener("mouseup", mu);
                    onEnd();
                }
                document.addEventListener("mousemove", mm);
                document.addEventListener("mouseup", mu);
            });
        }
    </script>
</body>
</html>
